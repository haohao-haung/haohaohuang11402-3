<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  
  <link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&family=Noto+Sans+TC:wght@700;900&family=Noto+Serif+TC:wght@900&family=Yuji+Syuku&display=swap" rel="stylesheet">

  <style>
    /* 基礎背景：宣紙質感 */
    body {
      background-color: #eaddc5;
      background-image: url('data:image/svg+xml,%3Csvg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noise"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="4" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100" height="100" filter="url(%23noise)" opacity="0.08"/%3E%3C/svg%3E');
      font-family: 'Noto Sans TC', sans-serif;
      overflow-x: hidden;
      color: #3e2723;
      user-select: none;
    }
    
    /* 宣紙/木紋戰鬥框 */
    .battle-box {
      background: rgba(245, 240, 230, 0.92);
      backdrop-filter: blur(8px);
      border-radius: 4px;
      border: 2px solid #5c4033;
      box-shadow: 0 15px 30px -5px rgba(0, 0, 0, 0.6), inset 0 0 20px rgba(139, 69, 19, 0.05);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    
    /* 字盤按鈕 */
    .char-btn {
      background: #faf6ed;
      color: #3e2723;
      border-radius: 6px;
      border: 2px solid #5c4033;
      box-shadow: 2px 3px 0px #3e2723;
      transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
    }
    @media (min-width: 768px) {
      .char-btn { border-radius: 8px; }
    }
    
    .char-btn:active:not(:disabled) {
      transform: translate(2px, 3px);
      box-shadow: 0 0 0 #3e2723;
    }

    /* 被選中的字 */
    .char-btn.selected {
      background: #8b2626;
      color: #faf6ed;
      border-color: #3e2723;
      transform: translate(2px, 3px);
      box-shadow: 0 0 0 transparent;
    }

    /* 奧義(題辭)方塊 */
    .phrase-block {
      background: #3e2723;
      color: #faf6ed;
      border-radius: 4px;
      border: 2px solid #b8860b;
      box-shadow: 3px 3px 0 rgba(184, 134, 11, 0.6);
      cursor: grab;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .phrase-block:active { cursor: grabbing; transform: scale(0.95); }
    .phrase-block.active-click { 
      background: #b8860b;
      color: #3e2723;
      border-color: #3e2723;
      box-shadow: 4px 4px 0 #3e2723;
      transform: scale(1.1) rotate(-2deg); 
    }

    /* 陣法分類框 */
    .category-basket {
      background: rgba(250, 246, 237, 0.7);
      backdrop-filter: blur(4px);
      border: 2px dashed #5c4033;
      border-radius: 6px;
      transition: all 0.2s;
      min-width: 85px;
      width: max-content;
      min-height: 74px;
    }
    @media (min-width: 768px) {
      .category-basket {
        min-width: 140px;
        min-height: 90px;
        border-radius: 8px;
      }
    }
    .category-basket.highlight {
      background: rgba(184, 134, 11, 0.2);
      border-style: solid;
      border-color: #8b2626;
      transform: scale(1.05);
      box-shadow: 4px 4px 0 rgba(139, 38, 38, 0.4);
    }

    /* 錯誤與魔王震動 */
    @keyframes shakeError {
      0%, 100% { transform: translateX(0) scale(1); }
      20%, 60% { transform: translateX(-12px) rotate(-4deg) scale(1.05); }
      40%, 80% { transform: translateX(12px) rotate(4deg) scale(1.05); }
    }
    .animate-shake { animation: shakeError 0.4s ease-in-out; border-color: #8b2626 !important; }

    /* 彈出動畫 */
    @keyframes popIn {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.05) rotate(1deg); opacity: 1; }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    .animate-pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

    /* 制霸烙印動畫 */
    @keyframes stampEffect {
      0% { transform: scale(4) rotate(-20deg); opacity: 0; }
      50% { transform: scale(0.8) rotate(-20deg); opacity: 1; }
      100% { transform: scale(1) rotate(-15deg); opacity: 1; filter: drop-shadow(2px 2px 0px rgba(0,0,0,0.5)); }
    }
    .animate-stamp {
      animation: stampEffect 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    /* 劍陣旋轉動畫 (已從終極大招拔除，保留給其他可能的地方) */
    @keyframes spinSlow {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    .animate-spin-slow { animation: spinSlow 15s linear infinite; }

    /* 新增：寶劍陸續飛入陣法的動畫 */
    @keyframes swordSeqAppear {
      0% { transform: translateY(150px) scale(0); opacity: 0; filter: brightness(2); }
      70% { transform: translateY(-10px) scale(1.1); opacity: 1; filter: brightness(1.5); }
      100% { transform: translateY(0px) scale(1); opacity: 1; filter: brightness(1); }
    }

    /* 光芒四射動畫 */
    @keyframes pulseRay {
      0%, 100% { opacity: 0.3; transform: scale(1) rotate(0deg); }
      50% { opacity: 0.6; transform: scale(1.05) rotate(3deg); }
    }
    .animate-pulse-ray { animation: pulseRay 4s ease-in-out infinite; }

    /* 寶劍飛射刺入血晶的動畫 */
    @keyframes strikeDown {
      0% { transform: translateY(400px) scale(2.5); opacity: 0; filter: drop-shadow(0 0 20px white); }
      30% { transform: translateY(50px) scale(1.8); opacity: 1; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }
    .animate-strike-down {
      animation: strikeDown 0.4s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
    }

    /* 斬擊刀光與螢幕閃爍特效 */
    @keyframes slashFlash {
      0% { transform: translate(-50%, -50%) rotate(-35deg) scaleX(0) scaleY(3); opacity: 0.8; }
      20% { transform: translate(-50%, -50%) rotate(-35deg) scaleX(1) scaleY(1); opacity: 1; background: #fff; }
      100% { transform: translate(-50%, -50%) rotate(-35deg) scaleX(1.5) scaleY(0); opacity: 0; }
    }
    .slash-effect {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 200vw;
      height: 12px;
      background: #fff;
      box-shadow: 0 0 20px #fff, 0 0 50px #faf6ed, 0 0 100px #8b2626;
      animation: slashFlash 0.3s cubic-bezier(0.1, 0.9, 0.2, 1) forwards;
      pointer-events: none;
      z-index: 9999;
    }
    @keyframes screenFlash {
      0% { opacity: 0.6; }
      100% { opacity: 0; }
    }
    .slash-screen-flash {
      position: absolute;
      inset: 0;
      background: white;
      animation: screenFlash 0.4s ease-out forwards;
      pointer-events: none;
      z-index: 9998;
    }

    /* 魂火(生命值) */
    .fire-icon { color: #8c8273; fill: currentColor; }
    .fire-icon.filled { color: #8b2626; filter: drop-shadow(0 0 3px rgba(139, 38, 38, 0.6)); }
    
    /* 檢討卷打勾變暗 */
    .review-item { transition: all 0.3s ease; }
    .review-item.checked { opacity: 0.4; filter: grayscale(100%); box-shadow: none; transform: translate(2px, 2px); border-color: #8c8273; }

    /* 滾動條美化 */
    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: rgba(92,64,51,0.1); border-radius: 4px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #8b2626; border-radius: 4px; }

    /* 寶劍破陣飛出放大動畫 */
    @keyframes flyOutAndScale {
      0% { transform: scale(0) translateY(200px) rotate(-45deg); opacity: 0; }
      30% { transform: scale(1.5) translateY(0) rotate(10deg); opacity: 1; filter: drop-shadow(0 0 30px rgba(255,255,255,0.8)); }
      70% { transform: scale(1.8) translateY(0) rotate(0deg); opacity: 1; filter: drop-shadow(0 0 40px rgba(255,255,255,0.9)); }
      100% { transform: scale(4) translateY(-150px) rotate(20deg); opacity: 0; filter: drop-shadow(0 0 60px rgba(255,255,255,1)); }
    }
    .animate-fly-out {
      animation: flyOutAndScale 2s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    /* 帥氣書法字體 (清晰易讀的霞鶩文楷) */
    .font-calligraphy {
      font-family: 'LXGW WenKai TC', 'DFKai-SB', 'BiauKai', 'KaiTi', serif;
    }

    /* 魔王戰奧義專屬霸氣字體 (極具殺氣與張力的明體/日系組合) */
    .font-boss-ultimate {
      font-family: 'Yuji Syuku', 'Noto Serif TC', 'BiauKai', serif;
    }
  </style>

    window.updateMusic = function() {
      if (state.isMusicPlaying) {
        if (state.gameState === 'bossIntro' || state.gameState === 'boss') {
          audios.bgm.pause();
          audios.introBgm.pause();
          if (audios.bossBgm) audios.bossBgm.play().catch(e => { console.log('Audio error:', e); state.isMusicPlaying = false; render(); });
        } else if (state.gameState === 'video' || state.gameState === 'bossKillVideo' || state.gameState === 'endingVideo') {
          audios.bgm.pause();
          audios.introBgm.pause();
          if (audios.bossBgm) audios.bossBgm.pause();
        } else if (['intro', 'story', 'instructions', 'postBossReview', 'victory'].includes(state.gameState)) {
          audios.bgm.pause();
          if (audios.bossBgm) audios.bossBgm.pause();
          audios.introBgm.play().catch(e => { console.log('Audio error:', e); state.isMusicPlaying = false; render(); });
        } else {
          audios.introBgm.pause();
          if (audios.bossBgm) audios.bossBgm.pause();
          audios.bgm.play().catch(e => { console.log('Audio error:', e); state.isMusicPlaying = false; render(); });
        }
      } else {
        audios.introBgm.pause();
        audios.bgm.pause();
        if (audios.bossBgm) audios.bossBgm.pause();
      }
    };

    function startLevel(levelIndex) {
      startGameFlow();
      const levelData = gameData[levelIndex];
      const shuffledQ = [...levelData.questions].sort(() => 0.5 - Math.random()).slice(0, 4);
      
      let chars = [];
      shuffledQ.forEach((qObj, qIdx) => {
        const textToSplit = Array.isArray(qObj.q) ? qObj.q[0] : qObj.q;
        textToSplit.split('').forEach((char, cIdx) => {
          chars.push({ id: `char-${qIdx}-${cIdx}`, char, status: 'idle' });
        });
      });
      
      setState({
        lives: 5,
        currentLevel: levelIndex,
        stageQuestions: shuffledQ,
        boardChars: chars.sort(() => 0.5 - Math.random()),
        selectedChars: [],
        phrases: [],
        activePhraseId: null,
        learningError: null,
        gameState: 'playing',
        levelStartTime: Date.now(),
        isBossMode: false
      });

      clearInterval(gameTimerInterval);
      gameTimerInterval = setInterval(() => {
        if (state.gameState === 'playing' && state.levelStartTime) {
          const el = document.getElementById('level-timer');
          if (el) {
            el.innerText = Math.floor((Date.now() - state.levelStartTime) / 1000);
          }
        }
      }, 1000);
    }

    function handleCharAction(charId) {
      if (state.isShaking || state.isVerifying) return;
      const charObj = state.boardChars.find(c => c.id === charId);
      if (!charObj) return;

      const isAlreadySelected = state.selectedChars.some(c => c.id === charId);
      
      if (isAlreadySelected) {
        playSound('pop');
        setState({
          selectedChars: state.selectedChars.filter(c => c.id !== charId),
          boardChars: state.boardChars.map(c => c.id === charId ? { ...c, status: 'idle' } : c)
        });
        return;
      }

      if (charObj.status !== 'idle' || state.selectedChars.length >= 4) return;

      playSound('pop');
      const newSelected = [...state.selectedChars, charObj];
      
      setState({
        selectedChars: newSelected,
        boardChars: state.boardChars.map(c => c.id === charId ? { ...c, status: 'selected' } : c)
      });

      if (newSelected.length === 4) {
        setState({ isVerifying: true });
        const spelledText = newSelected.map(c => c.char).join('');
        const matchedQuestion = state.stageQuestions.find(qObj => {
          if (Array.isArray(qObj.q)) return qObj.q.includes(spelledText);
          return qObj.q === spelledText;
        });

        if (matchedQuestion) {
          playSound('spellSuccess');
          const newPhraseId = `phrase-${Date.now()}`;
          setTimeout(() => {
            setState({
              boardChars: state.boardChars.map(c => newSelected.some(s => s.id === c.id) ? { ...c, status: 'hidden' } : c),
              selectedChars: [],
              isVerifying: false,
              phrases: [...state.phrases, { id: newPhraseId, q: spelledText, a: matchedQuestion.a, status: 'draggable' }],
              activePhraseId: newPhraseId 
            });
          }, 300);
        } else {
          playSound('error');
          handleWrongAction();
          
          const newErrorHistory = [...state.errorHistory];
          if (!newErrorHistory.some(e => e.type === 'spell' && e.input === spelledText)) {
            newErrorHistory.push({ 
              type: 'spell', 
              input: spelledText, 
              correctPhrases: state.stageQuestions.map(q => Array.isArray(q.q) ? q.q[0] : q.q),
              checked: false 
            });
          }

          setState({ isShaking: true, errorHistory: newErrorHistory });
          setTimeout(() => {
            setState({
              isShaking: false,
              boardChars: state.boardChars.map(c => newSelected.some(s => s.id === c.id) ? { ...c, status: 'idle' } : c),
              selectedChars: [],
              isVerifying: false
            });
          }, 600);
        }
      }
    }

    function handleWrongAction() {
      const newLives = state.lives - 1;
      setState({ lives: newLives });
      if (newLives <= 0) {
        clearInterval(gameTimerInterval); 
        setTimeout(() => setState({ gameState: 'gameover' }), 500);
      }
    }

    function processClassification(phraseId, targetCategory) {
      const phrase = state.phrases.find(p => p.id === phraseId);
      if (!phrase || phrase.status !== 'draggable') return;

      const isCorrect = Array.isArray(phrase.a) ? phrase.a.includes(targetCategory) : phrase.a === targetCategory;

      if (isCorrect) {
        playSound('categorySuccess');
        const newPhrases = state.phrases.map(p => p.id === phraseId ? { ...p, status: 'dropped', droppedCat: targetCategory } : p);
        const newScore = state.score + 50;
        
        setState({
          phrases: newPhrases,
          activePhraseId: null,
          score: newScore
        });
        
        const remaining = newPhrases.filter(p => p.status === 'draggable');
        const hiddenChars = state.boardChars.filter(c => c.status === 'hidden');
        if (remaining.length === 0 && hiddenChars.length === (state.stageQuestions.length * 4)) {
          setState({ levelClearAnim: true });
          playSound('swordFly');
          setTimeout(proceedToNextStage, 2000);
        }
      } else {
        playSound('error');
        handleWrongAction();
        const correctAnsStr = Array.isArray(phrase.a) ? phrase.a.join(' 或 ') : phrase.a;
        
        const newErrorHistory = [...state.errorHistory];
        if (!newErrorHistory.some(e => e.type === 'category' && e.phrase === phrase.q && e.wrongAns === targetCategory)) {
          newErrorHistory.push({ type: 'category', phrase: phrase.q, wrongAns: targetCategory, correctAns: correctAnsStr, checked: false });
        }

        setState({
          learningError: { phrase: phrase.q, wrongAns: targetCategory, correctAns: correctAnsStr },
          activePhraseId: null,
          errorHistory: newErrorHistory
        });
      }
    }

    // 將領悟按鈕的內嵌 JS 抽離成獨立函式，避免語法解析錯誤
    window.dismissLearningError = () => {
      const pending = state.phrases.find(p => p.status === 'draggable');
      setState({ learningError: null, activePhraseId: pending ? pending.id : null });
    };

    function proceedToNextStage() {
      playSound('clear');
      clearInterval(gameTimerInterval); 
      const nextCleared = state.clearedLevels.includes(state.currentLevel) 
        ? state.clearedLevels 
        : [...state.clearedLevels, state.currentLevel];
        
      const timeTaken = Math.floor((Date.now() - state.levelStartTime) / 1000);
      const timeBonus = Math.max(0, (60 - timeTaken) * 10); 
      const lifeBonus = state.lives * 100; 
      const levelTotalBonus = timeBonus + lifeBonus;
      const newScore = state.score + levelTotalBonus;

      setState({
        score: newScore,
        lastLevelStats: {
          timeTaken,
          timeBonus,
          lifeBonus,
          levelTotalBonus
        },
        clearedLevels: nextCleared,
        recentlyCleared: state.currentLevel,
        levelClearAnim: false,
        gameState: 'transition' 
      });
    }

    // --- 魔王戰系統 ---
    window.startBossFight = () => {
      playSound('epicStart');
      startGameFlow();
      
      const bQs = gameData.map((level, idx) => {
         const shuffledQuestions = [...level.questions].sort(() => 0.5 - Math.random());
         const selectedPairs = [];
         const usedCategories = new Set();

         for (const q of shuffledQuestions) {
            const qText = Array.isArray(q.q) ? q.q[0] : q.q;
            const cat = Array.isArray(q.a) ? q.a[0] : q.a;
            
            // 安全機制：過濾掉擁有多重答案的題辭，避免玩家配對時產生死結
            if (Array.isArray(q.a) && q.a.length > 1) continue;

            if (!usedCategories.has(cat)) {
               selectedPairs.push({ phrase: qText, category: cat });
               usedCategories.add(cat);
            }
            if (selectedPairs.length === 4) break;
         }

         if (selectedPairs.length < 4) {
             selectedPairs.length = 0; 
             const qs = [...level.questions]
                 .filter(q => !(Array.isArray(q.a) && q.a.length > 1))
                 .sort(() => 0.5 - Math.random())
                 .slice(0, 4);
             for (const q of qs) {
                 const qText = Array.isArray(q.q) ? q.q[0] : q.q;
                 const cat = Array.isArray(q.a) ? q.a[0] : q.a;
                 selectedPairs.push({ phrase: qText, category: cat });
             }
         }

         return {
            swordIdx: idx,
            pairs: selectedPairs
         };
      });

      state.bossQuestions = bQs;
      window.setupBossQuestion(0, true);
    };

    window.setupBossQuestion = (qIndex, isInitial = false) => {
        const q = state.bossQuestions[qIndex];
        const phrases = q.pairs.map(p => ({ id: 'p_'+p.phrase, text: p.phrase, type: 'phrase', status: 'idle', cat: p.category })).sort(() => 0.5 - Math.random());
        const categories = q.pairs.map((p, i) => ({ id: 'c_'+p.category+'_'+i, text: p.category, type: 'category', status: 'idle' })).sort(() => 0.5 - Math.random());

        const updates = {
            bossPairs: { phrases, categories },
            selectedBossPhrase: null,
            selectedBossCategory: null,
            bossClearedPairs: 0,
            bossTimer: 20
        };

        if (isInitial) {
            updates.gameState = 'boss';
            updates.bossHp = 9;
            updates.currentBossQ = 0;
            updates.lives = 5;
            updates.bossShake = false;
            updates.swordFlying = null;
            updates.showSlash = false;
            updates.finalUltimateAnim = false;
            updates.isBossMode = true;
        }

        setState(updates);

        clearInterval(bossTimerInterval);
        bossTimerInterval = setInterval(() => {
            if (state.gameState === 'boss' && state.swordFlying === null && !state.bossShake && state.bossClearedPairs < 4) {
                const newTimer = state.bossTimer - 1;
                if (newTimer <= 0) {
                    playSound('error');
                    const newLives = state.lives - 1;
                    if (newLives <= 0) {
                        clearInterval(bossTimerInterval);
                        setState({ bossTimer: 0, lives: 0, gameState: 'gameover' });
                    } else {
                        setState({ bossTimer: 20, lives: newLives, isShaking: true, selectedBossPhrase: null, selectedBossCategory: null });
                        setTimeout(() => setState({ isShaking: false }), 500);
                    }
                } else {
                    setState({ bossTimer: newTimer });
                }
            }
        }, 1000);
    };

    window.handleBossItemClick = (id, type) => {
      if (state.isShaking || state.swordFlying !== null) return; 

      const item = type === 'phrase' 
          ? state.bossPairs.phrases.find(p => p.id === id)
          : state.bossPairs.categories.find(c => c.id === id);
      
      if (!item || item.status === 'cleared') return;

      playSound('pop');

      let newSelPhrase = state.selectedBossPhrase;
      let newSelCat = state.selectedBossCategory;

      if (type === 'phrase') {
          if (newSelPhrase && newSelPhrase.id === id) newSelPhrase = null;
          else newSelPhrase = item;
      } else {
          if (newSelCat && newSelCat.id === id) newSelCat = null;
          else newSelCat = item;
      }

      setState({ selectedBossPhrase: newSelPhrase, selectedBossCategory: newSelCat });

      if (newSelPhrase && newSelCat) {
          let validCategories = [];
          for(const l of gameData) {
              for(const q of l.questions) {
                  const qt = Array.isArray(q.q) ? q.q[0] : q.q;
                  if(qt === newSelPhrase.text) {
                      validCategories = Array.isArray(q.a) ? q.a : [q.a];
                  }
              }
          }
          const matchFound = validCategories.includes(newSelCat.text) || newSelPhrase.cat === newSelCat.text;

          if (matchFound) {
             playSound('spellSuccess'); 
             const newPhrases = state.bossPairs.phrases.map(p => p.id === newSelPhrase.id ? { ...p, status: 'cleared' } : p);
             const newCats = state.bossPairs.categories.map(c => c.id === newSelCat.id ? { ...c, status: 'cleared' } : c);
             const newCleared = state.bossClearedPairs + 1;

             setState({
                 bossPairs: { phrases: newPhrases, categories: newCats },
                 selectedBossPhrase: null,
                 selectedBossCategory: null,
                 bossClearedPairs: newCleared,
                 score: state.score + 25 
             });
             
             if (newCleared === 4) {
                 clearInterval(bossTimerInterval);
                 playSound('swordFly'); 
                 // 觸發寶劍飛出放大動畫與斬擊圖層
                 setState({ swordFlying: state.currentBossQ, showSlash: true, levelClearAnim: true }); 
                 
                 // 延長等待時間，讓飛出放大動畫 (2秒) 有足夠時間播完再進入下一階段
                 setTimeout(() => {
                    playSound('epicStart'); 
                    setState({ bossShake: true, score: state.score + 100, showSlash: false, levelClearAnim: false }); 
                    
                    setTimeout(() => {
                       const newHp = state.bossHp - 1;
                       const nextQ = state.currentBossQ + 1;
                       if (newHp <= 0) {
                          // 觸發九劍齊發終極大招
                          playSound('epicStart');
                          setTimeout(() => playSound('clear'), 800);
                          // 修正：當血量歸零時，不要將 currentBossQ 推進到不存在的下一題，確保畫面維持渲染
                          setState({ finalUltimateAnim: true, showSlash: true, bossHp: 0, bossShake: false, swordFlying: null, levelClearAnim: false });
                          
                          setTimeout(() => {
                             setState({ gameState: 'bossKillVideo', finalUltimateAnim: false, showSlash: false });
                          }, 4500);
                       } else {
                          setState({ bossHp: newHp, currentBossQ: nextQ, bossShake: false, swordFlying: null });
                          window.setupBossQuestion(nextQ);
                       }
                    }, 600); 
                 }, 1800); // 等待飛出動畫接近尾聲時觸發震動
             }
          } else {
             playSound('error');
             
             const newErrorHistory = [...state.errorHistory];
             if (!newErrorHistory.some(e => e.type === 'boss' && e.phrase === newSelPhrase.text && e.wrongAns === newSelCat.text)) {
               newErrorHistory.push({
                 type: 'boss',
                 phrase: newSelPhrase.text,
                 wrongAns: newSelCat.text,
                 correctAns: newSelPhrase.cat,
                 checked: false
               });
             }

             setState({ 
                 isShaking: true, 
                 selectedBossPhrase: null,
                 selectedBossCategory: null,
                 errorHistory: newErrorHistory,
                 bossTimer: Math.max(1, state.bossTimer - 3) 
             });
             setTimeout(() => setState({ isShaking: false }), 500);
          }
      }
    };

    window.toggleErrorCheck = (index) => {
      playSound('pop');
      // 直接修改狀態，但不觸發全域的 setState (避免畫面重繪跳動)
      state.errorHistory[index].checked = !state.errorHistory[index].checked;
      const isChecked = state.errorHistory[index].checked;

      // 1. 局部更新該項目的外觀
      const itemEl = document.getElementById(`review-item-${index}`);
      if (itemEl) {
        if (isChecked) {
          itemEl.classList.remove('border-[#5c4033]', 'shadow-md');
          itemEl.classList.add('border-[#8c8273]', 'opacity-60', 'grayscale-[30%]');
        } else {
          itemEl.classList.remove('border-[#8c8273]', 'opacity-60', 'grayscale-[30%]');
          itemEl.classList.add('border-[#5c4033]', 'shadow-md');
        }
      }

      // 2. 局部更新打勾按鈕的圖示與顏色
      const btnEl = document.getElementById(`review-btn-${index}`);
      const iconEl = document.getElementById(`review-icon-${index}`);
      if (btnEl && iconEl) {
        if (isChecked) {
          btnEl.classList.remove('text-[#8b2626]', 'hover:scale-110');
          btnEl.classList.add('text-[#8c8273]');
          iconEl.className = 'ph-fill ph-check-square';
        } else {
          btnEl.classList.remove('text-[#8c8273]');
          btnEl.classList.add('text-[#8b2626]', 'hover:scale-110');
          iconEl.className = 'ph-bold ph-square';
        }
      }

      // 3. 結算數量並更新對應的按鈕狀態
      const uncheckedCount = state.errorHistory.filter(e => !e.checked).length;
      const allChecked = uncheckedCount === 0;

      const uncheckCountEl = document.getElementById('unchecked-count');
      if (uncheckCountEl) {
        if (uncheckedCount > 0) {
          uncheckCountEl.innerHTML = `待確認: ${uncheckedCount}`;
          uncheckCountEl.style.display = 'inline-block';
        } else {
          uncheckCountEl.style.display = 'none';
        }
      }

      // 更新地圖上的未確認數字標籤
      const mapUncheckCountEl = document.getElementById('map-unchecked-count');
      if (mapUncheckCountEl) {
        if (uncheckedCount > 0) {
          mapUncheckCountEl.innerHTML = uncheckedCount;
          mapUncheckCountEl.style.display = 'inline-block';
        } else {
          mapUncheckCountEl.style.display = 'none';
        }
      }

      const finalBtnContainer = document.getElementById('final-action-btn-container');
      if (finalBtnContainer) {
        if (allChecked) {
          finalBtnContainer.innerHTML = `
            <button onclick="setState({gameState: 'endingVideo', errorHistory: []})" class="w-full bg-[#b8860b] hover:bg-[#3e2723] hover:text-[#faf6ed] text-[#3e2723] py-4 px-6 text-xl md:text-2xl font-black border-2 border-[#5c4033] shadow-md active:translate-y-1 active:shadow-none transition-all flex items-center justify-center gap-2 rounded animate-pulse">
              回憶完成，觀看結局 ⏭
            </button>
          `;
        } else {
          finalBtnContainer.innerHTML = `
            <button disabled class="w-full bg-[#eaddc5] text-[#8c8273] py-4 px-6 text-xl md:text-2xl font-black border-2 border-[#8c8273] shadow-none cursor-not-allowed rounded flex items-center justify-center gap-2">
              <i class="ph-bold ph-lock"></i> 請先打勾確認所有回憶
            </button>
          `;
        }
      }

      // 更新通用卷軸的關閉按鈕
      const genericBtnContainer = document.getElementById('generic-modal-btn-container');
      if (genericBtnContainer) {
        if (allChecked) {
          genericBtnContainer.innerHTML = `
            <button onclick="setState({showReviewModal: false})" class="text-lg font-black text-[#faf6ed] bg-[#b8860b] hover:bg-[#8b2626] flex items-center gap-2 border-2 border-[#5c4033] px-6 py-3 shadow-md active:translate-y-1 active:shadow-none transition-all rounded animate-pulse">
              <i class="ph-bold ph-check-circle text-2xl"></i> 回憶完畢 (關閉)
            </button>
          `;
        } else {
          genericBtnContainer.innerHTML = `
            <button disabled class="text-lg font-black text-[#8c8273] bg-[#eaddc5] flex items-center gap-2 border-2 border-[#8c8273] px-6 py-3 shadow-none cursor-not-allowed rounded">
              <i class="ph-bold ph-lock text-2xl"></i> 請先打勾確認所有回憶
            </button>
          `;
        }
      }

      // 更新修羅場地圖的魔王戰按鈕
      const bossStartContainer = document.getElementById('boss-start-btn-container');
      if (bossStartContainer) {
        if (allChecked) {
          bossStartContainer.innerHTML = `
            <button onclick="setState({gameState: 'bossIntro'})" class="w-full max-w-2xl flex items-center justify-center gap-3 text-xl md:text-3xl font-black text-[#faf6ed] bg-[#8b2626] hover:bg-[#b8860b] hover:text-[#3e2723] px-8 py-5 border-2 border-[#5c4033] shadow-[0_0_20px_rgba(139,38,38,0.6)] animate-pulse active:scale-95 transition-all rounded-md">
              <i class="ph-fill ph-skull"></i> 最終決戰：討伐亂字魔王！
            </button>
          `;
        } else {
          bossStartContainer.innerHTML = `
            <button disabled class="w-full max-w-2xl flex items-center justify-center gap-3 text-xl md:text-3xl font-black text-[#8c8273] bg-[#eaddc5] border-2 border-[#8c8273] shadow-[0_0_20px_rgba(0,0,0,0.2)] opacity-90 px-8 py-5 cursor-not-allowed transition-all rounded-md">
              <i class="ph-bold ph-lock"></i> 閱讀並勾選完回憶，方可挑戰魔王
            </button>
          `;
        }
      }

      // 更新結算畫面的魔王戰按鈕
      const transitionBossContainer = document.getElementById('transition-boss-btn-container');
      if (transitionBossContainer) {
        if (allChecked) {
          transitionBossContainer.innerHTML = `
            <button onclick="setState({gameState: 'bossIntro'})" class="w-full bg-[#8b2626] text-[#faf6ed] py-3 px-6 text-lg md:text-xl font-black border-2 border-[#5c4033] shadow-md active:translate-y-1 active:shadow-none transition-all flex items-center justify-center gap-2 animate-pulse rounded">
              ⚔️ 迎戰亂字魔王！
            </button>
          `;
        } else {
          transitionBossContainer.innerHTML = `
            <button disabled class="w-full bg-[#eaddc5] text-[#8c8273] py-3 px-6 text-lg md:text-xl font-black border-2 border-[#8c8273] shadow-none cursor-not-allowed rounded flex items-center justify-center gap-2">
              <i class="ph-bold ph-lock"></i> 勾選完回憶方可挑戰魔王
            </button>
          `;
        }
      }
    };

    window.handleDragStart = (e, phraseId) => {
      e.dataTransfer.setData('phraseId', phraseId);
      setState({ activePhraseId: phraseId });
    };

    window.allowDrop = (e) => e.preventDefault();

    window.handleDrop = (e, cat) => {
      e.preventDefault();
      const phraseId = e.dataTransfer.getData('phraseId');
      processClassification(phraseId, cat);
    };

    window.clickCategory = (cat) => {
      if (state.activePhraseId) {
        processClassification(state.activePhraseId, cat);
      }
    };

    window.enterMap = (e) => {
      if (e) e.stopPropagation();
      clearInterval(gameTimerInterval); 
      clearInterval(bossTimerInterval);
      if (state.gameState === 'story' || state.gameState === 'instructions') {
        playSound('epicStart');
      } else {
        playSound('pop');
      }
      state.gameState = 'start';
      if (!state.isMusicPlaying) {
        state.isMusicPlaying = true;
      }
      window.updateMusic();
      render();
    };

    // --- 渲染畫面 ---
    function render() {
      const app = document.getElementById('app');
      
      const modalContainer = document.getElementById('review-modal-container');
      const savedScrollTop = modalContainer ? modalContainer.scrollTop : 0;

      // 新增：記憶結算畫面中清單的滾動位置
      const listContainer = document.getElementById('review-list-container');
      const savedListScrollTop = listContainer ? listContainer.scrollTop : 0;
      
      app.innerHTML = ''; 

      const musicBtn = state.gameState === 'intro' ? '' : `
        <div class="fixed top-2 right-2 md:top-4 md:right-4 z-[60]">
          <button onclick="toggleMusic(event)" class="bg-[#faf6ed]/90 backdrop-blur-sm p-2 md:p-3 rounded-full shadow-lg text-[#3e2723] border-2 border-[#5c4033] flex items-center gap-2 transition-all active:translate-y-1 active:shadow-none">
            <i class="${state.isMusicPlaying ? 'ph-bold ph-music-notes animate-pulse text-xl' : 'ph-bold ph-music-notes-simple opacity-50 text-xl'}"></i>
            ${(state.gameState === 'story' || state.gameState === 'instructions' || state.gameState === 'victory') && !state.isMusicPlaying ? '<span class="text-xs md:text-sm font-black animate-pulse px-1 text-[#8b2626]">開啟戰歌</span>' : ''}
          </button>
        </div>
      `;

      // 封裝敗北紀錄的渲染邏輯 (支援點擊展開、打勾)
      const renderErrorItems = () => {
        return state.errorHistory.map((e, index) => {
          let titleHtml = '';
          let detailHtml = '';
          
          if (e.type === 'boss') {
            titleHtml = `💀 魔王戰配對：「${e.phrase}」`;
            detailHtml = `
              <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4 font-bold mb-3">
                <span class="text-[#5c4033] line-through text-sm md:text-base">誤選：${e.wrongAns}</span>
                <span class="text-[#faf6ed] text-lg md:text-xl tracking-wide bg-[#3e2723] px-3 py-1 border-l-4 border-[#b8860b]">正解：${e.correctAns}</span>
              </div>
              <div class="text-sm md:text-base text-[#3e2723] font-bold">
                <i class="ph-bold ph-book-open text-[#8b2626] mr-1"></i> 
                <b>奧義解析：</b>${phraseDict[e.phrase] || `此為【${e.correctAns}】之用辭。`}
              </div>
            `;
          } else if (e.type === 'category') {

              </div>
              
              <div class="flex flex-col gap-4">
                ${state.errorHistory.length > 0 ? `
                  <button onclick="setState({showReviewModal: true})" class="w-full bg-[#8b2626]/70 backdrop-blur hover:bg-[#8b2626] text-[#faf6ed] py-3 px-6 text-lg md:text-xl font-black border border-[#faf6ed]/40 shadow-md active:translate-y-1 active:shadow-none transition-all flex items-center justify-center gap-2 rounded">
                    <i class="ph-bold ph-scroll text-2xl"></i> 檢視旅程回憶
                  </button>
                ` : ''}

                <button onclick="setState({clearedLevels: [], score: 0, recentlyCleared: null, playerName: '', gameState: 'intro'})" 
                        class="w-full bg-[#3e2723]/70 backdrop-blur hover:bg-[#b8860b] hover:text-[#3e2723] text-[#faf6ed] py-3 px-6 text-lg md:text-xl font-black border border-[#faf6ed]/40 shadow-md active:translate-y-1 active:shadow-none transition-all flex items-center justify-center gap-2 rounded">
                  <i class="ph-bold ph-arrows-clockwise text-2xl"></i> 重新開啟輪迴
                </button>
              </div>
            </div>
          </div>
        `;

      } else if (['gameover', 'transition'].includes(state.gameState)) {
        const isWin = state.gameState !== 'gameover';
        const lastClearedIdx = Math.min(state.recentlyCleared !== null ? state.recentlyCleared : state.currentLevel, gameData.length - 1);
        const rwd = gameData[lastClearedIdx]?.reward;
        
        content = `
          <div class="min-h-screen flex flex-col items-center justify-center p-4 overflow-hidden relative">
            <div class="fixed inset-0 z-0 pointer-events-none">
              <img src="遊玩畫面.png" alt="背景" onerror="this.src='遊玩畫面.jpg'" class="w-full h-full object-cover opacity-90" />
            </div>

            <div class="battle-box max-w-md w-full p-6 md:p-10 text-center relative z-10">
              
              <div class="flex justify-center -mt-28 md:-mt-40 -mb-20 md:-mb-32 pointer-events-none relative z-0">
                ${isWin && rwd ? `
                  <div class="w-[400px] h-[400px] md:w-[600px] md:h-[600px] transform rotate-[15deg] drop-shadow-[0_15px_25px_rgba(0,0,0,0.5)]">
                    ${getSwordSvg(rwd.swordType, rwd.colorHex)}
                  </div>
                ` : '<div class="text-7xl mt-28 mb-20 drop-shadow-md">💀</div>'}
              </div>
              
              <h2 class="text-3xl md:text-4xl font-black mb-2 relative z-10 ${isWin ? 'text-[#3e2723]' : 'text-[#8b2626]'}">
                ${isWin ? '陣法突破！' : '討伐失敗...'}
              </h2>
              <p class="font-bold text-base md:text-lg text-[#5c4033] mb-4 relative z-10">
                ${isWin && rwd ? `恭喜獲得寶劍：<span class="font-black text-xl md:text-2xl block mt-1 font-calligraphy tracking-widest" style="color: ${rwd.colorHex}">【${rwd.name}】</span>` : '修行不足，請檢討後再戰！'}
              </p>
              
              ${isWin && state.lastLevelStats ? `
                <div class="bg-[rgba(250,246,237,0.8)] p-4 border-2 border-[#5c4033] mb-6 text-left w-full mx-auto shadow-inner relative z-10 rounded">
                  <div class="flex justify-between items-center font-bold border-b border-dashed border-[#8c8273] pb-2 mb-2">
                    <span class="text-[#5c4033] flex items-center gap-1"><i class="ph-bold ph-clock text-[#3e2723]"></i> 通關耗時 (${state.lastLevelStats.timeTaken}s)</span>
                    <span class="text-[#b8860b]">+${state.lastLevelStats.timeBonus}</span>
                  </div>
                  <div class="flex justify-between items-center font-bold border-b border-dashed border-[#8c8273] pb-2 mb-2">
                    <span class="text-[#5c4033] flex items-center gap-1"><i class="ph-bold ph-fire text-[#8b2626]"></i> 殘餘魂火 (${state.lives}點)</span>
                    <span class="text-[#b8860b]">+${state.lastLevelStats.lifeBonus}</span>
                  </div>
                  <div class="flex justify-between items-center font-black text-lg md:text-xl pt-1">
                    <span class="text-[#3e2723]">陣法戰力追加</span>
                    <span class="text-[#8b2626]">+${state.lastLevelStats.levelTotalBonus}</span>
                  </div>
                </div>
              ` : ''}

              <div class="text-2xl md:text-3xl font-black text-[#faf6ed] mb-8 bg-[#b8860b] py-2 border-2 border-[#5c4033] shadow-md transform -rotate-1 relative z-10 rounded">
                累積戰力: <span class="text-[#3e2723] ml-1">${state.score}</span>
              </div>
              
              <div class="flex flex-col gap-4 relative z-10">
                ${state.errorHistory.length > 0 ? `
                  <button onclick="setState({showReviewModal: true})" class="w-full bg-[#8b2626] hover:bg-[#3e2723] text-[#faf6ed] py-3 px-6 text-lg md:text-xl font-black border-2 border-[#5c4033] shadow-md active:translate-y-1 active:shadow-none transition-all flex items-center justify-center gap-2 rounded">
                    <i class="ph-bold ph-scroll text-2xl"></i> 檢視旅程回憶
                  </button>
                ` : ''}

                ${isWin && state.clearedLevels.length === gameData.length ? `
                  <div id="transition-boss-btn-container" class="w-full">
                    ${uncheckedCountGlobal > 0 ? `
                      <button disabled class="w-full bg-[#eaddc5] text-[#8c8273] py-3 px-6 text-lg md:text-xl font-black border-2 border-[#8c8273] shadow-none cursor-not-allowed rounded flex items-center justify-center gap-2">
                        <i class="ph-bold ph-lock"></i> 勾選完回憶方可挑戰魔王
                      </button>
                    ` : `
                      <button onclick="setState({gameState: 'bossIntro'})" class="w-full bg-[#8b2626] text-[#faf6ed] py-3 px-6 text-lg md:text-xl font-black border-2 border-[#5c4033] shadow-md active:translate-y-1 active:shadow-none transition-all flex items-center justify-center gap-2 animate-pulse rounded">
                        ⚔️ 迎戰亂字魔王！
                      </button>
                    `}
                  </div>
                ` : `
                  <button onclick="setState({gameState: state.isBossMode ? 'bossIntro' : 'start'})" class="w-full bg-[#b8860b] hover:bg-[#3e2723] hover:text-[#faf6ed] text-[#3e2723] py-3 px-6 text-lg md:text-xl font-black border-2 border-[#5c4033] shadow-md active:translate-y-1 active:shadow-none transition-all flex items-center justify-center gap-2 rounded">
                    ${state.isBossMode ? '<i class="ph-bold ph-sword text-2xl"></i> 重新挑戰魔王' : '撤退回修羅場'}
                  </button>
                `}
              </div>
            </div>
          </div>
        `;

      } else if (state.gameState === 'playing') {
        const levelData = gameData[state.currentLevel];
        const half = Math.ceil(levelData.options.length / 2);
        const leftBaskets = levelData.options.slice(0, half);
        const rightBaskets = levelData.options.slice(half);

        const currentElapsed = state.levelStartTime ? Math.floor((Date.now() - state.levelStartTime) / 1000) : 0;

        const renderBasketHTML = (cat) => {
          const droppedPhrases = state.phrases.filter(p => p.status === 'dropped' && p.droppedCat === cat);
          const droppedHtml = droppedPhrases.map(p => `
            <div class="text-xs md:text-sm bg-[#3e2723] text-[#faf6ed] px-2 py-1 border border-[#b8860b] font-black text-center w-full shadow-sm whitespace-nowrap rounded-sm">
              ${p.q}
            </div>
          `).join('');

          return `
            <div ondragover="allowDrop(event)" ondrop="handleDrop(event, '${cat}')" onclick="clickCategory('${cat}')" class="category-basket flex flex-col items-center justify-start p-2 md:p-3 cursor-pointer ${state.activePhraseId ? 'highlight' : ''}">
              <div class="text-[14px] md:text-xl font-black text-[#3e2723] text-center leading-tight mb-2 border-b-2 border-[#5c4033] pb-1 w-full whitespace-nowrap">${cat}</div>
              <div class="w-full flex flex-col gap-1.5">
                ${droppedHtml}
              </div>
            </div>
          `;
        };

        const previewCharsHtml = [0,1,2,3].map(i => {
          const charObj = state.selectedChars[i];
          return `
            <div ${charObj ? `onclick="handleCharAction('${charObj.id}')"` : ''} class="w-10 h-10 md:w-14 md:h-14 rounded border-2 flex items-center justify-center text-xl md:text-3xl font-black transition-all ${charObj ? 'border-[#5c4033] bg-[#3e2723] text-[#faf6ed] cursor-pointer hover:bg-[#8b2626] shadow-sm' : 'border-[#8c8273] bg-[rgba(250,246,237,0.5)] text-transparent'}">
              ${charObj ? charObj.char : ''}
            </div>
          `;
        }).join('');

        const pendingPhrase = state.phrases.find(p => p.status === 'draggable');

        const gridHtml = state.boardChars.map(c => `
          <button onclick="handleCharAction('${c.id}')" ${c.status === 'hidden' || state.isShaking || state.isVerifying || pendingPhrase ? 'disabled' : ''} class="aspect-square text-2xl md:text-3xl font-black flex items-center justify-center ${c.status === 'hidden' ? 'opacity-0 pointer-events-none' : ''} ${c.status === 'selected' ? 'char-btn selected' : 'char-btn'}">
            ${c.char}
          </button>
        `).join('');

        const errorOverlay = state.learningError ? `
          <div class="fixed inset-0 bg-[#111]/80 backdrop-blur-sm z-[100] flex items-center justify-center p-4">
            <div class="battle-box max-w-md w-full p-6 md:p-10 text-center animate-shake border-2 border-[#8b2626]">
              <i class="ph-fill ph-warning text-6xl md:text-7xl text-[#8b2626] mb-4 drop-shadow-md"></i>
              <h2 class="text-3xl md:text-4xl font-black text-[#8b2626] mb-2 tracking-widest">破綻百出！</h2>
              <p class="text-lg md:text-xl font-bold text-[#3e2723] mb-6">此招不可用於「${state.learningError.wrongAns}」</p>
              
              <div class="bg-[rgba(139,38,38,0.05)] p-4 md:p-6 mb-8 border border-[#5c4033] rounded">
                <div class="text-sm md:text-base text-[#5c4033] font-bold mb-3 border-b border-[#5c4033] pb-2">銘記於心，真正的奧義是：</div>
                <div class="text-2xl md:text-3xl font-black text-[#3e2723] mb-4 leading-tight">
                  「<span class="text-[#8b2626] text-3xl md:text-4xl">${state.learningError.phrase}</span>」<br/>
                  <div class="text-lg mt-3 mb-1 text-[#5c4033]">適用於</div>
                  <div class="text-[#faf6ed] text-xl md:text-2xl bg-[#3e2723] px-3 py-1.5 border-l-4 border-[#b8860b] inline-block max-w-full break-words shadow-md">
                    【${state.learningError.correctAns}】
                  </div>
                </div>
                <div class="text-sm md:text-base text-left text-[#3e2723] pt-3 border-t border-dashed border-[#5c4033]">
                  <i class="ph-bold ph-book-open text-[#8b2626] mr-1"></i> 
                  <b>解析：</b>${phraseDict[state.learningError.phrase] || `此為祝賀/哀輓之辭。`}
                </div>
              </div>
              <button onclick="dismissLearningError()" class="w-full bg-[#3e2723] text-[#faf6ed] hover:bg-[#8b2626] py-4 text-xl md:text-2xl font-black border-2 border-[#5c4033] shadow-md active:translate-y-1 active:shadow-none transition-all rounded">
                領悟！
              </button>
            </div>
          </div>
        ` : '';

        // 更新：加上傾斜(italic)與微旋轉展現動態感
        const levelClearAnimOverlay = state.levelClearAnim && levelData.reward ? `
          <div class="fixed inset-0 z-[100] flex flex-col items-center justify-center pointer-events-none">
            <div class="absolute inset-0 bg-[#3e2723]/80 backdrop-blur-sm animate-pulse"></div>
            <div class="w-48 h-72 md:w-80 md:h-[400px] animate-fly-out relative z-10 flex items-center justify-center">
              ${getSwordSvg(levelData.reward.swordType, levelData.reward.colorHex)}
            </div>
            <div class="absolute mt-64 md:mt-80 text-5xl md:text-7xl font-bold italic tracking-widest font-calligraphy animate-pop-in z-20 transform -rotate-2" style="color: #ffffff; text-shadow: 0 0 15px ${levelData.reward.colorHex}, 0 0 30px ${levelData.reward.colorHex}, 0 0 50px ${levelData.reward.colorHex}, 4px 6px 12px rgba(0,0,0,0.9);">
               陣法突破
            </div>
          </div>
        ` : '';

        content = `
          ${errorOverlay}
          ${levelClearAnimOverlay}
          <div class="min-h-screen flex flex-col items-center py-4 md:py-6 px-1 md:px-4 relative">
            <div class="fixed inset-0 z-0 pointer-events-none">
              <img src="遊玩畫面.png" alt="背景" onerror="this.src='遊玩畫面.jpg'" class="w-full h-full object-cover opacity-90" />
            </div>

            <div class="w-full max-w-5xl flex justify-between items-center mb-6 battle-box px-4 py-3 md:px-6 md:py-4 mx-2 relative z-10">
              <div class="flex flex-col md:flex-row md:items-center gap-2 md:gap-4">
                <button onclick="enterMap(event)" class="text-sm md:text-base font-bold text-[#5c4033] hover:text-[#faf6ed] hover:bg-[#3e2723] bg-[rgba(250,246,237,0.8)] px-4 py-1.5 border border-[#5c4033] transition-colors flex items-center gap-1 self-start rounded shadow-sm">
                  <i class="ph-bold ph-arrow-u-up-left"></i> 撤退
                </button>
                <h2 class="text-base md:text-2xl font-black tracking-widest text-[#3e2723]">${levelData.levelName}</h2>
              </div>
              <div class="flex flex-col items-end gap-1">
                <div class="flex gap-1 bg-[#3e2723] px-2 py-1 rounded shadow-inner">
                  ${fireHtml.join('')}
                </div>
                <div class="flex gap-3 md:gap-4 mt-1">
                  <div class="font-black text-[#3e2723] text-base md:text-xl border-b-2 border-[#5c4033] flex items-center gap-1">
                    <i class="ph-bold ph-clock text-[#5c4033]"></i> <span id="level-timer">${currentElapsed}</span>s
                  </div>
                  <div class="font-black text-[#3e2723] text-base md:text-xl border-b-2 border-[#8b2626]">戰力: <span class="text-[#8b2626]">${state.score}</span></div>
                </div>
              </div>
            </div>

            <div class="w-full max-w-5xl flex flex-row justify-center items-start gap-2 md:gap-6 px-1 md:px-0 relative z-10">
              
              <div class="flex flex-col gap-3 md:gap-4 flex-shrink-0">
                ${leftBaskets.map(cat => renderBasketHTML(cat)).join('')}
              </div>

              <div class="battle-box flex-1 min-w-[180px] max-w-[440px] p-3 md:p-8 relative">
                <div class="text-center text-xs md:text-sm font-bold text-[#5c4033] mb-4 bg-[rgba(139,38,38,0.05)] py-1 rounded">💡 點擊上方預覽框可取消符印</div>
                
                <div class="flex justify-center gap-2 md:gap-4 mb-6 md:mb-8 min-h-[44px] md:min-h-[60px]">
                  ${previewCharsHtml}
                </div>

                <div class="relative w-full min-h-[220px] md:min-h-[320px]">
                  <div class="grid grid-cols-4 gap-2 md:gap-4 mx-auto px-1 md:px-0 transition-all duration-300 ${pendingPhrase ? 'opacity-30 pointer-events-none grayscale-[50%]' : ''}">
                    ${gridHtml}
                  </div>

                  ${pendingPhrase ? `
                    <div class="absolute inset-0 flex items-center justify-center z-20">
                      <div class="bg-[rgba(250,246,237,0.95)] backdrop-blur-sm p-6 md:p-10 border-2 border-[#b8860b] flex flex-col items-center animate-pop-in w-11/12 max-w-[340px] shadow-lg rounded">
                        <div class="text-[#5c4033] font-bold mb-6 text-sm md:text-base border-b border-dashed border-[#8c8273] pb-2">👆 奧義鎖定，點擊兩側陣法歸位</div>
                        <div class="phrase-block px-6 py-4 md:px-10 md:py-6 text-3xl md:text-5xl font-black transform scale-110 tracking-widest">
                          ${pendingPhrase.q}
                        </div>
                      </div>
                    </div>
                  ` : ''}
                </div>
              </div>

              <div class="flex flex-col gap-3 md:gap-4 flex-shrink-0">
                ${rightBaskets.map(cat => renderBasketHTML(cat)).join('')}
              </div>

            </div>
          </div>
        `;
      }

      app.innerHTML = musicBtn + content + reviewModalHTML;

      if (state.showReviewModal) {
        const newModalContainer = document.getElementById('review-modal-container');
        if (newModalContainer) newModalContainer.scrollTop = savedScrollTop;
      }
      
      // 新增：恢復結算清單的滾動位置
      if (state.gameState === 'postBossReview') {
        const newListContainer = document.getElementById('review-list-container');
        if (newListContainer) newListContainer.scrollTop = savedListScrollTop;
      }
    }

    render();
  </script>
</body>
</html>
